[workspace]
resolver = "2"
members = [
    "packages/cli",
    "packages/media",
    "packages/server",
]

[workspace.dependencies]
mosaic-media = { path = "packages/media", version = "0.0.1" }

env_logger = "0.11.8"
log = "0.4.27"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.142"
